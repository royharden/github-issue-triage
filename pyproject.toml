[project]
name = "github-issue-triage"
version = "0.1.0"
description = "Local fixture issue triage with provisional review and zero-write previews."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.12,<3",
    "fastapi==0.143.2",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "cryptography==50.0.2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_triage"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
